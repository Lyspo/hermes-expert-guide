<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 · THE SHELL</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Martian+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090A;--pane:#0D1113;--line:#1C2427;--fg:#E6EDEF;--mid:#8898A0;--low:#4E5B63;
--go:#5CE6A5;--no:#FF5F6E;--ref:#54A8FF;--am:#FFC043}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Martian Mono',monospace;font-size:13px;line-height:1.6;overflow:hidden}
.g{font-family:'Bricolage Grotesque',system-ui,sans-serif}

.app{display:grid;grid-template-columns:minmax(0,46%) minmax(0,54%);height:100vh}
@media(max-width:56rem){.app{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}

/* ── left: a shell you actually drive ─────────────────────────────────── */
.sh{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--pane);flex:none}
.tab{padding:9px 16px;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--low);border-right:1px solid var(--line)}
.tab.on{color:var(--fg);background:var(--bg);box-shadow:inset 0 -1px 0 var(--go)}
.out{flex:1;overflow-y:auto;padding:18px 20px;min-height:0;scrollbar-width:thin}
.out::-webkit-scrollbar{width:6px}.out::-webkit-scrollbar-thumb{background:#1E282C}
.ln{white-space:pre-wrap;font-size:.72rem;line-height:1.75}
.p{color:var(--go)} .dim{color:var(--low)} .no{color:var(--no)} .am{color:var(--am)} .rf{color:var(--ref)}
.cmd{color:var(--fg)}
.entry{flex:none;display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--pane)}
.entry .p{flex:none}
#in{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:.78rem;caret-color:var(--go)}
.hints{flex:none;display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 14px;border-top:1px solid var(--line)}
.hint{font-size:.6rem;padding:4px 9px;border:1px solid var(--line);color:var(--mid);cursor:pointer;transition:.15s}
.hint:hover{border-color:var(--go);color:var(--go)}

/* ── right: what the command rendered ─────────────────────────────────── */
.view{overflow-y:auto;padding:0;min-height:0;background:var(--bg)}
.vh{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 28px;
  display:flex;justify-content:space-between;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--low);z-index:2}
.vb{padding:34px 28px 20vh;max-width:46rem}
.vb h1{font-size:clamp(1.9rem,3.6vw,3rem);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin-bottom:.9rem}
.vb .lede{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;color:var(--mid);font-size:1.05rem;line-height:1.5;letter-spacing:-.01em;max-width:44ch}
.vb h2{font-size:1.15rem;font-weight:600;margin:2.4rem 0 .7rem;letter-spacing:-.02em}
.vb p{font-family:'Bricolage Grotesque',sans-serif;font-size:1rem;line-height:1.65;color:#B9C6CC;margin-bottom:1rem;max-width:56ch}
.vb b{color:var(--fg)}
.blk{border:1px solid var(--line);background:var(--pane);padding:14px 16px;margin:1.2rem 0;font-size:.72rem;line-height:1.8}
.blk .k{color:var(--ref)}
.diffline{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.72rem;padding:3px 0}
.diffline.m{color:#C08A90} .diffline.m span:first-child{color:var(--no)}
.diffline.a{color:var(--fg)} .diffline.a span:first-child{color:var(--go)}
.meter{height:5px;background:#141B1E;border:1px solid var(--line);position:relative;margin:.5rem 0 .3rem}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--go)}
.cap{font-size:.6rem;color:var(--low);letter-spacing:.06em;text-transform:uppercase}
.ghost{color:var(--low);font-size:.75rem;padding-top:20vh;text-align:center}
</style></head><body>
<div class="app">
  <section class="sh">
    <div class="tabs"><div class="tab on">hermes — guide</div><div class="tab">~/.hermes</div><div class="tab">state.db</div></div>
    <div class="out" id="out"></div>
    <div class="entry"><span class="p">❯</span><input id="in" autofocus spellcheck="false" placeholder="type a command, or press ↹"></div>
    <div class="hints" id="hints"></div>
  </section>
  <section class="view">
    <div class="vh"><span id="vt">no page loaded</span><span id="vm">—</span></div>
    <div class="vb" id="vb"><p class="ghost">Run a command on the left.<br>The guide is the machine's own surface — there is no menu.</p></div>
  </section>
</div>
<script>
const out=document.getElementById('out'), inp=document.getElementById('in'), vb=document.getElementById('vb'),
      vt=document.getElementById('vt'), vm=document.getElementById('vm'), hints=document.getElementById('hints');
const say=(h,c='')=>{const d=document.createElement('div');d.className='ln '+c;d.innerHTML=h;out.appendChild(d);out.scrollTop=1e9};

const PAGES={
 'memory show':{t:'memory · two files and an index',m:'module 05 · 12 min',
  h:`<h1>Memory is two files and an index.</h1>
  <p class="lede">Not a three-layer system. Two capped markdown files injected as a frozen snapshot, plus a searchable archive of every past session.</p>
  <div class="blk"><span class="dim">$</span> ls ~/.hermes/memories/<br><span class="k">MEMORY.md</span>  <span class="k">USER.md</span></div>
  <p><b>MEMORY.md</b> holds what the agent learned. <b>USER.md</b> holds what it concluded about you. The caps are the part worth internalising — <b>2,200</b> and <b>1,375</b> characters. Not tokens. Characters.</p>
  <div class="meter"><i style="width:67%"></i></div><p class="cap">MEMORY.md · 1,474 / 2,200 characters</p>
  <div class="meter"><i style="width:45%"></i></div><p class="cap">USER.md · 620 / 1,375 characters</p>
  <h2>They are a snapshot, not a live view</h2>
  <p>Read once at session start and injected into the system prompt. If the agent writes to memory at turn forty, <b>it does not see its own write</b> until you start a new session. That follows from the one rule: the prompt is assembled once.</p>`},
 'skills nudge':{t:'the nudge counter',m:'module 06 · 15 min',
  h:`<h1>What actually fires, and what it is allowed to do.</h1>
  <p class="lede">A counter that increments once per tool-loop iteration, a forked agent that runs after your answer is on screen, and four walls that keep it out of your conversation.</p>
  <div class="blk"><span class="k">memory</span>:<br>  nudge_interval: <span class="k">10</span><br><span class="k">skills</span>:<br>  creation_nudge_interval: <span class="k">10</span></div>
  <p>The counter increments inside the tool-calling loop — <b>once per API-call iteration</b>, not once per message you send. That distinction is the whole behaviour of the loop.</p>
  <h2>The documentation disagrees</h2>
  <div class="diffline m"><span>−</span><span>The background review runs roughly every ten agent turns.</span></div>
  <div class="diffline a"><span>+</span><span>It fires every ten tool-calling iterations. One request taking five round-trips advances it by five.</span></div>
  <p class="cap" style="margin-top:.8rem">agent/conversation_loop.py:118 @ d372fda · confirmed twice in capture 4a1f</p>`},
 'approvals test':{t:'approvals · the gate that did not fire',m:'module 04 · 14 min',
  h:`<h1>The prompt you were promised.</h1>
  <p class="lede">Under the default mode an LLM risk-assesses the command and may approve it silently.</p>
  <div class="blk"><span class="dim">❯</span> rm -rf /tmp/scratch<br><span class="dim">┊ 🔧 shell</span><br><span class="am">✓ 0.4s</span>  <span class="dim">— no prompt shown</span></div>
  <div class="diffline m"><span>−</span><span>Dangerous commands trigger an approval prompt before they run.</span></div>
  <div class="diffline a"><span>+</span><span>Under approvals.mode: smart an LLM risk-assesses and may auto-approve. Only the hardline blocklist and your own deny globs are deterministic.</span></div>
  <p style="margin-top:1rem">Set <b>approvals.mode: manual</b> if you require a prompt every time. The prompt, when it fires, is a numbered arrow-key menu with a <b>300-second countdown that fails closed</b> — undocumented.</p>`}};

const HELP=[['memory show','the two files, their caps, the snapshot rule'],
            ['skills nudge','the counter, the fork, the four walls'],
            ['approvals test','run a dangerous command and see what happens'],
            ['ls','what else is here'],['whoami','pick your track']];

function render(k){const p=PAGES[k];if(!p)return false;vt.textContent=p.t;vm.textContent=p.m;
  vb.innerHTML=p.h;vb.scrollTop=0;vb.parentElement.scrollTop=0;return true}

function run(raw){
  const c=raw.trim(); if(!c)return;
  say(`<span class="p">❯</span> <span class="cmd">${c}</span>`);
  if(c==='ls'){say('<span class="dim">available topics</span>');HELP.forEach(([k,d])=>say(`  <span class="rf">${k.padEnd(18)}</span><span class="dim">${d}</span>`));return}
  if(c==='whoami'){say('<span class="dim">track unset — the guide adapts to one of:</span>');
    say('  <span class="rf">newcomer</span>  <span class="dim">33 core lessons · 6h 20m</span>');
    say('  <span class="rf">operator</span>  <span class="dim">46 core lessons · 9h 12m</span>');
    say('  <span class="rf">architect</span> <span class="dim">35 core lessons · 7h 07m</span>');return}
  if(render(c)){say(`<span class="dim">rendering</span> <span class="rf">${PAGES[c].t}</span> <span class="dim">→</span>`);return}
  say(`<span class="no">unknown:</span> ${c} <span class="dim">— try</span> <span class="rf">ls</span>`);
}
HELP.forEach(([k])=>{const b=document.createElement('div');b.className='hint';b.textContent=k;
  b.onclick=()=>{inp.value=k;run(k);inp.value=''};hints.appendChild(b)});
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){run(inp.value);inp.value=''}
  if(e.key==='Tab'){e.preventDefault();const m=HELP.find(([k])=>k.startsWith(inp.value.trim()));if(m)inp.value=m[0]}});
say('<span class="dim">hermes-agent v0.19.0 · guide shell · 51 lessons indexed</span>');
say('<span class="dim">the curriculum is the filesystem. type</span> <span class="rf">ls</span> <span class="dim">to see it.</span>');
</script></body></html>
