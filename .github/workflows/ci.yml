name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deliberately separate steps: a failure should name which gate failed
      # rather than reporting "verify failed".
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Social cards
        run: pnpm og

      - name: Build and export
        run: pnpm build

      - name: Search index
        run: pnpm search-index

      - name: Internal links
        run: pnpm links

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Runs against out/, which the previous steps just produced.
      - name: End-to-end and accessibility
        run: pnpm e2e

      # No longer continue-on-error. That flag was a temporary honesty measure while the
      # lesson budget sat 59 kB below the framework floor and could not be passed by any
      # amount of work. Budgets are now measured as first-party JavaScript on top of a
      # floor read from a page that has none, so failing this step means something was
      # actually written that costs too much.
      - name: JavaScript budgets
        run: pnpm budgets

      # Serves out/ itself on its own port, so it does not collide with the Playwright
      # step above. LCP and CLS are hard assertions; category scores are warnings,
      # because scoring folds in throttled network simulation that moves several points
      # run to run on a machine we do not control.
      - name: Lighthouse (LCP and CLS)
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 7
