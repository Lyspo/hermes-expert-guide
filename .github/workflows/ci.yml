name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deliberately separate steps: a failure should name which gate failed
      # rather than reporting "verify failed".
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build and export
        run: pnpm build

      - name: Internal links
        run: pnpm links

      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 7
