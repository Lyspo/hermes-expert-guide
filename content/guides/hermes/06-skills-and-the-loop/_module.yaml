title: 'Skills and the improvement loop'
order: 6
arc: 'cognition'
summary: >-
  The centre of the guide. A skill is a procedure in a file; the loop that writes
  and revises those files is a counter, a forked review, and an editorial policy —
  three mechanisms usually described as one piece of magic.
outcome: >-
  read and write a skill deliberately, trace the improvement loop through its
  actual code path, and recognise the ways it degrades over time.
